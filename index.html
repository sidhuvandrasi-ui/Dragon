<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(255,0,140,.10),
      transparent 38%
    ),
    #080812;

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  padding:28px 12px;

  overflow-x:hidden;
}


/* MAIN CONTAINER */

.page{
  width:100%;
  max-width:570px;

  min-height:calc(100vh - 56px);

  padding:34px 28px 28px;

  position:relative;

  border:1px solid rgba(255,0,140,.42);

  border-radius:42px 42px 0 0;

  background:
    linear-gradient(
      180deg,
      rgba(15,15,28,.97),
      rgba(7,7,16,.98)
    );

  box-shadow:
    0 0 25px rgba(255,0,140,.08),
    inset 0 0 50px rgba(255,0,140,.025);

  overflow:hidden;
}


/* TOP DECORATION */

.page::before{
  content:"";

  position:absolute;

  top:-100px;
  left:50%;

  width:280px;
  height:200px;

  transform:translateX(-50%);

  background:rgba(255,0,140,.12);

  filter:blur(70px);

  pointer-events:none;
}


/* HEADER */

.header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:15px;

  position:relative;

  z-index:2;

  margin-bottom:48px;
}

.brand{
  font-size:22px;

  font-weight:900;

  letter-spacing:2px;

  white-space:nowrap;
}


/* WIN RATE */

.win-rate{
  display:flex;

  align-items:center;

  gap:9px;

  padding:9px 14px;

  border:1px solid #ff1493;

  border-radius:30px;

  color:#ff3ba7;

  font-size:14px;

  font-weight:800;

  white-space:nowrap;

  box-shadow:
    0 0 10px rgba(255,20,147,.25),
    inset 0 0 10px rgba(255,20,147,.05);

  animation:badgePulse 2.4s ease-in-out infinite;
}

.win-dot{
  width:9px;
  height:9px;

  border-radius:50%;

  background:#ff1493;

  box-shadow:
    0 0 8px #ff1493,
    0 0 16px #ff1493;
}

@keyframes badgePulse{

  0%,100%{
    box-shadow:
      0 0 8px rgba(255,20,147,.2);
  }

  50%{
    box-shadow:
      0 0 18px rgba(255,20,147,.45);
  }

}


/* LOGO */

.logo-wrap{
  display:flex;

  justify-content:center;
  align-items:center;

  margin-bottom:55px;
}

.logo{
  width:190px;
  height:190px;

  border-radius:50%;

  display:flex;

  justify-content:center;
  align-items:center;

  position:relative;

  border:4px solid #ff1493;

  background:
    radial-gradient(
      circle,
      rgba(255,0,140,.12),
      rgba(20,5,25,.7)
    );

  box-shadow:
    0 0 12px rgba(255,20,147,.7),
    0 0 35px rgba(255,20,147,.45),
    0 0 70px rgba(255,20,147,.18);

  animation:logoGlow 2.8s ease-in-out infinite;
}

.logo::after{
  content:"";

  position:absolute;

  inset:10px;

  border-radius:50%;

  border:1px solid rgba(255,20,147,.18);
}

.logo-text{
  font-size:54px;

  font-weight:900;

  letter-spacing:-4px;

  background:
    linear-gradient(
      100deg,
      #ffffff 0%,
      #ffffff 48%,
      #ff1594 49%,
      #ff1594 100%
    );

  -webkit-background-clip:text;
  background-clip:text;

  -webkit-text-fill-color:transparent;

  position:relative;

  z-index:2;
}

@keyframes logoGlow{

  0%,100%{
    transform:scale(1);

    box-shadow:
      0 0 12px rgba(255,20,147,.65),
      0 0 35px rgba(255,20,147,.38),
      0 0 65px rgba(255,20,147,.15);
  }

  50%{
    transform:scale(1.025);

    box-shadow:
      0 0 18px rgba(255,20,147,.9),
      0 0 48px rgba(255,20,147,.55),
      0 0 85px rgba(255,20,147,.22);
  }
}


/* MAIN TITLE */

.main-title{
  text-align:center;

  font-size:54px;

  line-height:1;

  font-weight:1000;

  letter-spacing:1px;

  color:#ff1493;

  text-shadow:
    0 0 8px rgba(255,20,147,.8),
    0 0 22px rgba(255,20,147,.6),
    0 0 45px rgba(255,20,147,.28);

  margin-bottom:42px;

  animation:titleGlow 2.5s ease-in-out infinite alternate;
}

@keyframes titleGlow{

  from{
    text-shadow:
      0 0 7px rgba(255,20,147,.55),
      0 0 18px rgba(255,20,147,.35);
  }

  to{
    text-shadow:
      0 0 10px rgba(255,20,147,.9),
      0 0 28px rgba(255,20,147,.65),
      0 0 48px rgba(255,20,147,.25);
  }

}


/* COMMUNITY TITLE */

.community{
  text-align:center;

  font-size:29px;

  line-height:1.25;

  font-weight:900;

  margin-bottom:28px;
}

.community span{
  display:block;
}


/* DESCRIPTION */

.description{
  max-width:480px;

  margin:0 auto 44px;

  text-align:center;

  color:#b8b8c2;

  font-size:19px;

  line-height:1.65;

}


/* FEATURES */

.features{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;

  margin-bottom:48px;
}

.feature{

  min-height:150px;

  padding:22px 10px 15px;

  border:1px solid rgba(255,20,147,.35);

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,20,147,.035),
      rgba(255,255,255,.015)
    );

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  box-shadow:
    inset 0 0 20px rgba(255,20,147,.025);

  transition:.25s ease;
}

.feature:hover{

  transform:translateY(-5px);

  border-color:#ff1493;

  box-shadow:
    0 0 20px rgba(255,20,147,.18);
}

.feature-icon{

  height:48px;

  display:flex;

  align-items:center;

  justify-content:center;

  margin-bottom:14px;

  color:#ff1493;

  font-size:32px;

  text-shadow:
    0 0 12px #ff1493;
}

.feature-icon.signal{
  font-size:35px;
}

.feature-icon.sound{
  font-size:31px;
}

.feature-icon.vip{
  font-size:22px;

  padding:7px 9px;

  border-radius:5px;

  background:#ff1493;

  color:#160514;

  font-weight:900;

  text-shadow:none;

  box-shadow:
    0 0 14px rgba(255,20,147,.7);
}

.feature-title{

  font-size:17px;

  font-weight:900;

  line-height:1.3;
}


/* JOIN BUTTON */

.join{

  width:100%;

  min-height:112px;

  border-radius:27px;

  background:
    linear-gradient(
      135deg,
      #ff1796,
      #ff249e
    );

  color:#fff;

  text-decoration:none;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:25px;

  font-size:28px;

  font-weight:1000;

  letter-spacing:.5px;

  text-align:center;

  box-shadow:
    0 0 18px rgba(255,20,147,.65),
    0 0 45px rgba(255,20,147,.35);

  transition:.25s ease;

  position:relative;

  overflow:hidden;

  animation:buttonPulse 2.4s ease-in-out infinite;
}

.join::before{

  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:50%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.25),
      transparent
    );

  transform:skewX(-20deg);

  animation:shine 3s infinite;
}

@keyframes shine{

  0%{
    left:-100%;
  }

  45%,100%{
    left:150%;
  }

}

.join:hover{

  transform:translateY(-3px);

  box-shadow:
    0 0 25px rgba(255,20,147,.85),
    0 0 60px rgba(255,20,147,.45);
}

.join:active{
  transform:scale(.98);
}

.join-content{
  position:relative;
  z-index:2;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:20px;
}

.join-dot{

  width:27px;
  height:27px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 10px rgba(255,255,255,.5);
}

.join-arrow{
  font-size:34px;

  font-weight:400;
}


/* FOOTER */

.footer{

  text-align:center;

  margin-top:25px;

  color:#555564;

  font-size:11px;

  letter-spacing:1.5px;
}


/* SIDE DECORATION */

.decor{
  position:absolute;

  left:-10px;
  bottom:230px;

  width:70px;

  height:70px;

  opacity:.7;

  transform:rotate(-18deg);
}

.decor span{

  display:block;

  width:45px;

  height:2px;

  background:#eee;

  margin:11px 0;
}


/* RESPONSIVE */

    font-size:22px;
  }

}

</style>
