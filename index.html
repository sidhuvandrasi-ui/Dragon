<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:#020b05;
  color:white;
  font-family:Arial,sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;
}


/* CARD */

.card{

  width:100%;
  max-width:430px;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(70,120,40,.18),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #03170b,
      #011008
    );

  border:1px solid rgba(150,170,45,.65);

  border-radius:32px;

  padding:55px 25px 38px;

  text-align:center;

  box-shadow:
    0 0 35px rgba(70,120,40,.12),
    inset 0 0 60px rgba(0,80,40,.10);
}


/* LOGO */

.logo{

  width:145px;
  height:145px;

  margin:0 auto 38px;

  border-radius:50%;

  background:#00150b;

  border:5px solid #91a936;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 0 0 8px rgba(110,140,40,.08),
    0 0 22px rgba(110,150,45,.25);

  animation:logoNeon 2.8s ease-in-out infinite;
}

.logo span{

  font-size:42px;
  font-weight:900;

  color:#b7c75c;

  letter-spacing:-2px;
}


/* LOGO NEON */

@keyframes logoNeon{

  0%,100%{

    box-shadow:
      0 0 0 5px rgba(110,140,40,.08),
      0 0 22px rgba(110,150,45,.25);

  }

  50%{

    box-shadow:
      0 0 0 7px rgba(160,190,50,.10),
      0 0 42px rgba(160,200,55,.50);

  }
}


/* TITLE */

.title{

  font-family:Georgia,serif;

  font-size:32px;

  font-weight:700;

  letter-spacing:2px;

  color:#e5bd35;

  animation:titleGlow 3s ease-in-out infinite;
}


/* TITLE GLOW */

@keyframes titleGlow{

  0%,100%{

    text-shadow:
      0 0 5px rgba(230,190,45,.15);

  }

  50%{

    text-shadow:
      0 0 10px rgba(230,190,45,.55),
      0 0 25px rgba(230,190,45,.25);

  }
}


/* DIVIDER */

.divider{

  width:150px;
  height:5px;

  margin:28px auto 28px;

  border-radius:20px;

  background:#c8a92d;

}


/* HEADING */

.heading{

  font-size:21px;

  font-weight:800;

  color:white;

  margin-bottom:22px;

}


/* SUBTITLE */

.subtitle{

  font-size:17px;

  font-weight:600;

  color:#9eaea5;

  margin-bottom:48px;

}


/* JOIN BUTTON */

.join{

  width:100%;

  min-height:70px;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:13px;

  padding:15px;

  text-decoration:none;

  border-radius:16px;

  background:#056a31;

  border:1px solid rgba(0,190,80,.55);

  color:white;

  font-size:20px;

  font-weight:800;

  letter-spacing:1px;

  box-shadow:
    0 8px 22px rgba(0,100,45,.25);

  animation:buttonNeon 2s ease-in-out infinite;

  transition:.2s ease;

}


/* BUTTON NEON */

@keyframes buttonNeon{

  0%,100%{

    box-shadow:
      0 8px 22px rgba(0,100,45,.25);

  }

  50%{

    box-shadow:
      0 8px 30px rgba(0,150,65,.50),
      0 0 22px rgba(0,150,65,.25);

  }
}


/* TELEGRAM */

.telegram{

  width:35px;
  height:35px;

  border-radius:50%;

  background:white;

  color:#08763b;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:19px;
  font-weight:900;

}


/* ARROW */

.arrow{

  color:#e3b92f;

  font-size:24px;

}


/* NOTE */

.note{

  margin-top:24px;

  font-size:13px;

  font-weight:600;

  color:#87978e;

}


/* FOOTER */

.footer{

  margin-top:40px;

  padding-top:24px;

  border-top:1px solid rgba(150,160,50,.18);

  color:#65736c;

  font-size:11px;

  letter-spacing:2px;

}


/* MOBILE */

@media(max-width:380px){

  body{
    padding:12px;
  }

  .card{
    padding:45px 20px 30px;
    border-radius:28px;
  }

  .logo{
    width:125px;
    height:125px;
  }

  .logo span{
    font-size:36px;
  }

  .title{
    font-size:27px;
  }

  .heading{
    font-size:19px;
  }

  .subtitle{
    font-size:15px;
    margin-bottom:40px;
  }

  .join{
    font-size:17px;
  }

}

</style>

<body>


<div class="card">

    <span>DG</span>
  </div>


  <div class="title">
    DG PREDICTION HUB
  </div>


  <div class="divider"></div>


  <div class="heading">
    Join To Get Premium Access
  </div>


  <div class="subtitle">
    Get Daily Exclusive Insights ✨
  </div>


  <a
    href="https://t.me/+kX0O6mGTDaQ5MTU1"
    target="_blank"
    rel="noopener noreferrer"
    class="join"
    id="telegramBtn"
  >

    <span class="telegram">➤</span>

    JOIN TELEGRAM

    <span class="arrow">➤</span>

  </a>


  <div class="note">
    Tap to open Telegram and join instantly
  </div>


  <div class="footer">
    DG PREDICTION HUB • PREMIUM COMMUNITY
  </div>


</div>


<script>

document
.getElementById("telegramBtn")
.addEventListener("click",function(){

  if(typeof fbq === "function"){

    fbq("track","Subscribe");

  }

});

</script>


</body>
    </html>
