<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
}


/* =========================
   BODY
========================= */

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;

  font-family:Arial,Helvetica,sans-serif;

  color:white;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(0,255,120,.12),
      transparent 35%
    ),
    radial-gradient(
      circle at 20% 80%,
      rgba(0,180,255,.08),
      transparent 35%
    ),
    #030505;

  overflow:hidden;

  position:relative;
}


/* =========================
   BACKGROUND GLOW
========================= */

body::before{
  content:"";

  position:fixed;

  width:420px;
  height:420px;

  border-radius:50%;

  background:rgba(0,255,100,.07);

  filter:blur(80px);

  top:-180px;
  left:-150px;

  animation:moveGlow 7s ease-in-out infinite alternate;

  pointer-events:none;
}

body::after{
  content:"";

  position:fixed;

  width:400px;
  height:400px;

  border-radius:50%;

  background:rgba(0,200,255,.06);

  filter:blur(90px);

  bottom:-180px;
  right:-150px;

  animation:moveGlow2 8s ease-in-out infinite alternate;

  pointer-events:none;
}

@keyframes moveGlow{

  from{
    transform:translate(0,0);
  }

  to{
    transform:translate(180px,120px);
  }

}

@keyframes moveGlow2{

  from{
    transform:translate(0,0);
  }

  to{
    transform:translate(-150px,-100px);
  }

}


/* =========================
   PARTICLES
========================= */

.particles{

  position:fixed;

  inset:0;

  pointer-events:none;

  overflow:hidden;

  z-index:0;

}

.particles span{

  position:absolute;

  width:4px;
  height:4px;

  background:#00ff88;

  border-radius:50%;

  box-shadow:
    0 0 6px #00ff88,
    0 0 14px #00ff88;

  opacity:.7;

  animation:floatParticle linear infinite;

}

.particles span:nth-child(1){
  left:8%;
  animation-duration:7s;
  animation-delay:1s;
}

.particles span:nth-child(2){
  left:18%;
  animation-duration:10s;
  animation-delay:2s;
}

.particles span:nth-child(3){
  left:30%;
  animation-duration:8s;
  animation-delay:3s;
}

.particles span:nth-child(4){
  left:45%;
  animation-duration:11s;
}

.particles span:nth-child(5){
  left:58%;
  animation-duration:9s;
  animation-delay:2s;
}

.particles span:nth-child(6){
  left:70%;
  animation-duration:12s;
  animation-delay:1s;
}

.particles span:nth-child(7){
  left:82%;
  animation-duration:8s;
  animation-delay:4s;
}

.particles span:nth-child(8){
  left:93%;
  animation-duration:10s;
  animation-delay:2s;
}

@keyframes floatParticle{

  0%{
    bottom:-10px;
    transform:translateX(0) scale(.5);
    opacity:0;
  }

  15%{
    opacity:.8;
  }

  50%{
    transform:translateX(30px) scale(1);
  }

  85%{
    opacity:.7;
  }

  100%{
    bottom:110%;
    transform:translateX(-30px) scale(.3);
    opacity:0;
  }

}


/* =========================
   MAIN CARD
========================= */

.card{

  width:100%;
  max-width:430px;

  padding:38px 25px 25px;

  text-align:center;

  position:relative;

  z-index:2;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.07),
      rgba(255,255,255,.025)
    );

  border:1px solid rgba(0,255,120,.28);

  border-radius:24px;

  box-shadow:
    0 0 15px rgba(0,255,100,.12),
    0 0 45px rgba(0,255,100,.07),
    inset 0 0 25px rgba(0,255,100,.025);

  backdrop-filter:blur(16px);

  -webkit-backdrop-filter:blur(16px);

  animation:cardGlow 3s ease-in-out infinite alternate;

}


@keyframes cardGlow{

  from{

    box-shadow:
      0 0 15px rgba(0,255,100,.12),
      0 0 45px rgba(0,255,100,.06),
      inset 0 0 20px rgba(0,255,100,.02);

  }

  to{

    box-shadow:
      0 0 25px rgba(0,255,100,.22),
      0 0 65px rgba(0,255,100,.10),
      inset 0 0 30px rgba(0,255,100,.04);

  }

}


/* =========================
   TOP NEON LINE
========================= */

.card::before{

  content:"";

  position:absolute;

  top:0;
  left:15%;

  width:70%;
  height:2px;

  border-radius:50%;

  background:#00ff88;

  box-shadow:
    0 0 5px #00ff88,
    0 0 15px #00ff88,
    0 0 30px #00ff88;

  animation:topLine 2s ease-in-out infinite alternate;

}

@keyframes topLine{

  from{
    opacity:.45;
    transform:scaleX(.7);
  }

  to{
    opacity:1;
    transform:scaleX(1);
  }

}


/* =========================
   LOGO
========================= */

.logo{
  margin-bottom:12px;
}

.logo span{

  display:inline-flex;

  justify-content:center;
  align-items:center;

  width:72px;
  height:72px;

  font-size:36px;

  font-weight:900;

  color:#00ff88;

  border:2px solid #00ff88;

  border-radius:50%;

  background:rgba(0,255,100,.05);

  text-shadow:
    0 0 5px #00ff88,
    0 0 15px #00ff88,
    0 0 30px #00ff88;

  box-shadow:
    0 0 8px rgba(0,255,120,.6),
    0 0 20px rgba(0,255,120,.35),
    inset 0 0 15px rgba(0,255,120,.12);

  animation:
    logoPulse 2s ease-in-out infinite,
    logoFloat 3s ease-in-out infinite;

}


@keyframes logoPulse{

  0%,100%{

    box-shadow:
      0 0 8px rgba(0,255,120,.5),
      0 0 20px rgba(0,255,120,.25);

  }

  50%{

    box-shadow:
      0 0 12px rgba(0,255,120,.8),
      0 0 35px rgba(0,255,120,.45),
      0 0 55px rgba(0,255,120,.2);

  }

}


@keyframes logoFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-5px);
  }

}


/* =========================
   TITLE
========================= */

.title{

  font-size:27px;

  font-weight:900;

  letter-spacing:1px;

  color:#ffffff;

  text-shadow:
    0 0 5px rgba(255,255,255,.4),
    0 0 15px rgba(0,255,120,.35);

  animation:titleGlow 2.5s ease-in-out infinite alternate;

}


@keyframes titleGlow{

  from{

    text-shadow:
      0 0 5px rgba(255,255,255,.3),
      0 0 12px rgba(0,255,120,.2);

  }

  to{

    text-shadow:
      0 0 8px rgba(255,255,255,.5),
      0 0 22px rgba(0,255,120,.5);

  }

}


/* =========================
   DIVIDER
========================= */

.divider{

  width:80px;

  height:2px;

  margin:16px auto 22px;

  background:#00ff88;

  box-shadow:
    0 0 5px #00ff88,
    0 0 15px #00ff88,
    0 0 25px #00ff88;

  animation:dividerGlow 2s ease-in-out infinite alternate;

}


@keyframes dividerGlow{

  from{
    width:60px;
    opacity:.5;
  }

  to{
    width:110px;
    opacity:1;
  }

}


/* =========================
   HEADING
========================= */

.heading{

  font-size:19px;

  font-weight:bold;

  color:#ffffff;

  margin-bottom:10px;

}


/* =========================
   SUBTITLE
========================= */

.subtitle{

  font-size:15px;

  color:#bfc8c4;

  margin-bottom:40px;

}


/* =========================
   JOIN BUTTON
========================= */

.join{

  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

  width:100%;

  padding:17px 20px;

  color:#001b0d;

  background:#00ff88;

  border-radius:13px;

  text-decoration:none;

  font-size:17px;

  font-weight:900;

  letter-spacing:.5px;

  box-shadow:
    0 0 8px #00ff88,
    0 0 20px rgba(0,255,136,.65),
    0 0 40px rgba(0,255,136,.25);

  overflow:hidden;

  transition:.25s ease;

  animation:buttonPulse 2s ease-in-out infinite;

}


.join::before{

  content:"";

  position:absolute;

  top:0;

  left:-120%;

  width:60%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.65),
      transparent
    );

  transform:skewX(-20deg);

  animation:buttonShine 2.8s infinite;

}


@keyframes buttonShine{

  0%{
    left:-120%;
  }

  45%,100%{
    left:140%;
  }

}


@keyframes buttonPulse{

  0%,100%{

    box-shadow:
      0 0 8px #00ff88,
      0 0 20px rgba(0,255,136,.55),
      0 0 40px rgba(0,255,136,.2);

  }

  50%{

    box-shadow:
      0 0 12px #00ff88,
      0 0 30px rgba(0,255,136,.8),
      0 0 55px rgba(0,255,136,.35);

  }

}


.join:hover{

  transform:translateY(-3px) scale(1.02);

  box-shadow:
    0 0 15px #00ff88,
    0 0 35px #00ff88,
    0 0 70px rgba(0,255,136,.45);

}


.join:active{

  transform:scale(.97);

}


/* =========================
   BUTTON ICONS
========================= */

.telegram{

  font-size:22px;

  font-weight:bold;

  position:relative;

  z-index:2;

}


.arrow{

  font-size:18px;

  position:relative;

  z-index:2;

  animation:arrowMove 1s ease-in-out infinite;

}


@keyframes arrowMove{

  0%,100%{
    transform:translateX(0);
  }

  50%{
    transform:translateX(5px);
  }

}


/* =========================
   NOTE
========================= */

.note{

  margin-top:16px;

  font-size:12px;

  color:#7e8984;

}


/* =========================
   WINNING STATUS
========================= */

.winning{

  margin:25px auto 0;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  width:max-content;

  padding:8px 16px;

  border-radius:30px;

  color:#00ff88;

  border:1px solid rgba(0,255,136,.35);

  background:rgba(0,255,136,.05);

  font-size:13px;

  font-weight:bold;

  text-shadow:
    0 0 8px #00ff88;

  box-shadow:
    0 0 12px rgba(0,255,136,.15);

  animation:winningPulse 1.7s ease-in-out infinite;

}


.winDot{

  width:8px;

  height:8px;

  border-radius:50%;

  background:#00ff88;

  box-shadow:
    0 0 5px #00ff88,
    0 0 15px #00ff88;

  animation:dotBlink 1s infinite;

}


@keyframes winningPulse{

  0%,100%{
    transform:scale(1);
    opacity:.75;
  }

  50%{
    transform:scale(1.05);
    opacity:1;
  }

}


@keyframes dotBlink{

  0%,100%{
    opacity:.3;
    transform:scale(.7);
  }

  50%{
    opacity:1;
    transform:scale(1.2);
  }

}


/* =========================
   WINNING POPUP
========================= */

.winPopup{

  position:fixed;

  left:50%;

  top:25px;

  transform:
    translateX(-50%)
    translateY(-100px);

  z-index:10;

  padding:11px 20px;

  border:1px solid rgba(0,255,136,.6);

  border-radius:12px;

  background:rgba(0,20,12,.9);

  color:#00ff88;

  font-size:14px;

  font-weight:900;

  white-space:nowrap;

  box-shadow:
    0 0 10px #00ff88,
    0 0 30px rgba(0,255,136,.45);

  opacity:0;

  animation:winPopup 5s ease-in-out infinite;

}


@keyframes winPopup{

  0%,8%{

    opacity:0;

    transform:
      translateX(-50%)
      translateY(-100px);

  }

  15%,72%{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(0);

  }

  82%,100%{

    opacity:0;

    transform:
      translateX(-50%)
      translateY(-100px);

  }

}


/* =========================
   FOOTER
========================= */

.footer{

  margin-top:28px;

  font-size:10px;

  letter-spacing:1px;

  color:#66716c;

  text-shadow:
    0 0 8px rgba(0,255,136,.15);

}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  body{
    padding:15px;
  }

  .card{
    padding:32px 20px 22px;
    border-radius:21px;
  }

  .logo span{

    font-size:36px;

    width:68px;
    height:68px;

  }

  .title{
    font-size:27px;
  }

  .heading{
    font-size:19px;
  }

  .subtitle{

    font-size:15px;

    margin-bottom:40px;

  }

  .join{
    font-size:17px;
  }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:350px){

  .title{
    font-size:23px;
  }

  .heading{
    font-size:17px;
  }

  .join{

    font-size:15px;

    padding:15px;

  }

}

</style>
